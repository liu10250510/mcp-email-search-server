[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mcp-email-search"
version = "2.0.0"
description = "MCP server for email search with client-side LLM classification"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Lucy", email = "lucy@example.com"}
]
keywords = ["mcp", "email", "search", "classification", "yahoo", "llm"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.0.0",
    "imapclient>=3.0.1",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
    "fastmcp>=0.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "black>=23.0.0",
    "isort>=5.12.0",
    "mypy>=1.5.0",
]

[project.scripts]
mcp-email-search = "mcp_email_search.server:main"

[tool.hatch.build.targets.wheel]
packages = ["mcp_email_search"]

[tool.black]
line-length = 88
target-version = ['py310']

[tool.isort]
profile = "black"
line_length = 88

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
